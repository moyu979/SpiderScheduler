# 是否执行下载操作
do_download: false

# 下载线程数
download_thread: 1

# 每轮下载的限制，当满足任意一条时，会在完成这次下载后停止下载
# 每次下载数量（单位：个），-1表示无限制
once_download_number: -1
# 每次下载大小（单位：MB），-1表示无限制
once_download_size: 1024
# 下载持续时间（单位：秒），-1表示无限制
once_download_duration: -1

# 每轮下载的间隔（单位：秒），-1表示无限制，此时等效于持续下载
download_interval: -1

# 每个下载的配置
## 是否等待播放，如果为true，则会在下载完成后（对视频），sleep视频对应的时长，以模拟用户播放行为
waiting_play: false
## 如果不等待播放，进行定长睡眠
sleep_second: 10

# 控制每个下载的
# 下载类型
download_kind:
  - all

# 缓存控制
use_cache: false

# 下载路径
download_path: "./${BASE_PATH}/datas/download"
# 缓存路径
cache_path: "./${BASE_PATH}/datas/download_cache"
# 是否使用缓存
use_cache: false

