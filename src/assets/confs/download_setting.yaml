# 是否执行下载操作
do_download: false

# 下载线程数
download_thread: 1

# 每轮下载的限制，当满足任意一条时，会在完成这次下载后停止下载
# 每次下载数量（单位：个），-1表示无限制
once_download_number: -1

# 每轮下载的间隔（单位：秒），-1表示无限制，此时等效于持续下载
download_interval: -1

# 每个下载的配置
## 是否等待播放，如果为true，则会在下载完成后（对视频），sleep脚本 download_it 返回的 duration 时长，
## 未返回时长时按 sleep_second 睡眠，以模拟用户播放行为
waiting_play: false
## 如果不等待播放，进行定长睡眠
sleep_second: 10

# 缓存控制
## 是否使用下载缓存：开启时脚本先写缓存中的专属工作目录，完成后由框架把产物
## 拷贝到最终保存路径并清理缓存；关闭时脚本直接写最终保存目录
use_cache: true

# 下载路径（最终保存路径）
download_path: "./${BASE_PATH}/datas/download"
# 缓存路径（use_cache 开启时的中转目录）
cache_path: "./${BASE_PATH}/datas/download_cache"

