# 代理相关
# 是否使用代理
use_proxy: false
# 代理IP
proxy_ip: "127.0.0.1"
proxy_port: "7897"

# cookie相关
# cookie文件路径
# 约定：BASE_PATH 默认可约定为 ./docker（需在配置加载层做变量替换）
cookie_file: "./${BASE_PATH}/resource/cookie.pkl"
# 是否使用cookie
use_cookie: true
# 域名
domain: "https://www.pixiv.net"

# 浏览器内核路径配置
#windows_chrome_path: "C:\\Program Files\\Google\\Chrome\\Application\\chromedriver.exe"
#linux_chrome_path: "/usr/local/bin/chromedriver"
#mac_chrome_path: "/usr/local/bin/chromedriver"
chrome_path: "/usr/local/bin/chromedriver"

# 后端API相关
# 后端API路径
rest_api_host: "0.0.0.0"
rest_api_port: 5000
