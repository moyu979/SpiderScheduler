# 各站点独立的更新配置：键为 website，值为该站点生效的配置覆盖。
# 未写出的键回落 update_setting.yaml 的全局值；全局 do_update 是总开关，
# 站点级可用 do_update: false 单独关闭某站点（恢复后自动重新拉起）。
#
# 查更新本身就是对目标站页面的爬取，因此每个站点的节奏独立可控：
# 线程数 / 轮间隔 / 位点间错峰全部按站点隔离。
#
# 可覆盖的键：do_update / update_thread / update_interval / commit_interval
#
# 示例：
# pixiv:
#   update_thread: 2
#   update_interval: 3600
#   commit_interval: 8
# danbooru:
#   do_update: false
